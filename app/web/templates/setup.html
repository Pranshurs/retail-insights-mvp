{% extends "base.html" %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
<h1>Set up your store</h1>
<p class="mut">Choose the owner password for this dashboard (at least 10 characters).</p>
<form method="post" action="/setup">
<input type="hidden" name="csrf" value="{{ csrf }}">
<p><input type="password" name="password" placeholder="Password" required minlength="10" style="width:100%"></p>
<p><input type="password" name="confirm" placeholder="Repeat password" required style="width:100%"></p>
<button>Create</button>
</form></div>
{% endblock %}
